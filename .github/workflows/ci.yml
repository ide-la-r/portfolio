name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    name: Type-check and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      # astro check + astro build: a type error or a broken page fails the run
      - run: npm run build
